<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Registrar Saque</title>
</head>

<body>

    <div class="conteiner">

        <form action="/saque" method="POST">

            <h1>Saque</h1>

            <input 
                type="number"
                name="valor"
                placeholder="Digite o valor"
            >

            <button class="botao-voltar" type="submit">
                Salvar
            </button>

            <a class="botao-voltar" href="/painel">
                Voltar
            </a>

        </form>

    </div>

</body>
</html>
