<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Erro Login</title>

    <style>

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            flex-direction: column;

            min-height: 100vh;

            background: linear-gradient(135deg, #0cf099, #06c57a);

            font-family: Arial;
        }

        .erro {
            background: rgba(255,255,255,0.15);

            padding: 40px;

            border-radius: 20px;

            backdrop-filter: blur(12px);

            text-align: center;

            color: white;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 15px;

            text-shadow:
                0 0 10px rgba(0,0,0,0.4);
        }

        p {
            font-size: 18px;

            margin-bottom: 25px;
        }

        a {
            display: inline-flex;

            justify-content: center;
            align-items: center;

            width: 200px;
            height: 50px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            background: black;

            font-weight: bold;

            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
        }

    </style>
</head>

<body>

    <div class="erro">

        <h1>
            ❌ Usuário ou senha inválidos
        </h1>

        <p>
            Verifique os dados e tente novamente.
        </p>

        <a href="/">
            Voltar
        </a>

    </div>

</body>
</html>
